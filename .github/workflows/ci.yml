name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The integration job below only runs on these two.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        node-version: [20, 21, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      # Reuse the Next.js build cache between runs. Keyed by lockfile and app source, so a change to either starts cold.
      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{ts,tsx,js,jsx,mjs,css,json}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # @sororail/sdk only exposes its type declarations from dist/, built by
      # tsup, so apps/web can't typecheck against it until this runs first.
      - run: pnpm build
      # Budget for the client JS the reference app ships.
      - run: pnpm --filter @sororail/web bundle:check
      # Budget for the SDK's shipped ESM bundle. The tsup build enforces this
      # already (onSuccess); running it here too keeps the check visible in CI.
      - run: pnpm --filter @sororail/sdk bundle:check
      # Fails when the SDK's exported types change without the snapshot being
      # updated, so a breaking change is always a visible, deliberate diff.
      - run: pnpm --filter @sororail/sdk api:check
      # Compiles the runnable examples against the client API so a renamed or
      # removed method cannot leave them silently rotting until the scheduled
      # integration run.
      - run: pnpm --filter @sororail/sdk typecheck:examples
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Dead code: unused files, exports and dependencies across the workspace. Pinned to major 5.
      - run: pnpm knip
      # Playwright needs a built app and its own browser download.
      # Cache browser binaries to avoid re-downloading on every run (#111).
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps
      # Unit tests run in the test-shards job. Here only the Playwright suite runs.
      - run: pnpm --filter @sororail/web exec playwright test
      # Coverage is reported once, on the newest Node version in the matrix.
      - name: SDK test coverage
        if: matrix.node-version == 22
        run: pnpm --filter @sororail/sdk test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: sdk-coverage
          path: packages/sdk/coverage/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: apps/web/playwright-report/
          retention-days: 7

  changeset:
    name: changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Advisory: a PR that changes published behaviour should carry a
      # changeset. Not every PR needs one, so this reports rather than blocks.
      # Surface the result as a workflow warning so it's visible in the PR
      # checks UI instead of silently discarded (#113).
      - name: Check for changeset
        id: changeset
        run: pnpm exec changeset status --since=origin/main
        continue-on-error: true
      - name: Warn if changeset is missing
        if: steps.changeset.outcome == 'failure'
        run: |
          echo "::warning::No changeset found. If this PR changes published behaviour, add one with \`pnpm exec changeset\`."
          echo "### ⚠️ No changeset found" >> "$GITHUB_STEP_SUMMARY"
          echo "If this PR changes published behaviour, add one with \`pnpm exec changeset\`." >> "$GITHUB_STEP_SUMMARY"

  # Checks every link in the built docs site. Internal links are remapped onto
  # the build output; external links are checked live. Hosts that rate-limit
  # anonymous requests are excluded.
  docs-links:
    name: docs links
    runs-on: ubuntu-latest
    if: github.event_name != schedule
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sororail/docs build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: true
          args: >-
            --base https://sororail.github.io
            --remap "https://sororail.github.io/sororail-frontend/(.*) file://${{ github.workspace }}/apps/docs/dist/$1"
            --exclude "^https?://(www\.)?(linkedin|x|twitter)\.com"
            --exclude "^https?://(www\.)?reddit\.com"
            "apps/docs/dist/**/*.html"

  # The examples talk to a real network, so they run on a schedule rather than
  # on every PR. Each one asserts what it demonstrates, so together they are the
  # SDK's integration suite. The job funds its own throwaway testnet accounts
  # through friendbot (no secrets) and deploys a fresh instance of each contract
  # per run, because testnet resets and every contract but batch_payout is
  # claimed permanently by its first `create`/`init`.
  integration:
    name: examples against testnet
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: stellar/stellar-cli@v23.0.1
      - name: Check out the contracts
        uses: actions/checkout@v4
        with:
          repository: Sororail/sororail-contracts
          path: contracts
      - name: Build the contracts
        working-directory: contracts
        run: |
          rustup target add wasm32v1-none
          stellar contract build
      - name: Run the examples
        working-directory: packages/sdk
        env:
          WASM_DIR: ${{ github.workspace }}/contracts/target/wasm32v1-none/release
        run: pnpm test:integration

  # Vitest runs in four parallel shards per package. Coverage is still produced once, by the sdk-coverage step in check.
  test-shards:
    name: unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # apps/web imports @sororail/sdk from dist/, so build it first.
      - run: pnpm build
      - run: pnpm --filter @sororail/sdk exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/4
      - run: pnpm --filter @sororail/web exec vitest run --passWithNoTests --shard=${{ matrix.shard }}/4

  # Lints every workflow file so a bad expression fails the PR instead of failing on execution.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  # Prints the full advisory count to the job summary, then fails only on high or critical advisories.
  # Exceptions are listed under pnpm.auditConfig.ignoreCves in package.json (see CONTRIBUTING.md).
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Write the advisory summary
        run: |
          pnpm audit --json > audit-all.json || true
          {
            echo "### pnpm audit"
            echo ""
            echo "| Severity | Count |"
            echo "|---|---|"
            jq -r '.metadata.vulnerabilities | to_entries[] | "| \(.key) | \(.value) |"' audit-all.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level high

  # The one check to require in branch protection. It fails if any job it depends on did not succeed.
  all-checks:
    name: all-checks
    if: always() && github.event_name != 'schedule'
    needs: [check, test-shards, actionlint, audit, docs-links]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result != "success")] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad required job(s) did not succeed"
            exit 1
          fi
