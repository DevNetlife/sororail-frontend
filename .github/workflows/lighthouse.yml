name: Lighthouse

# Performance and accessibility budget for the reference app (#431). Thresholds live in apps/web/lighthouserc.json.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # @sororail/sdk is consumed from its built output, so build the workspace (as the CI job does).
      - run: pnpm build
      # Pinned and run through npx so the budget check adds nothing to the lockfile. Uses the runner's Chrome.
      - name: Run Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 14
